name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Docker Login
      # -------------------------
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/digital-library-frontend:${{ github.sha }} \
            ./frontend

      # -------------------------
      # Push Docker Image
      # -------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/digital-library-frontend:${{ github.sha }}


          # -------------------------
      # Set Kubernetes Context
      # -------------------------
      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      # -------------------------
      # Helm Deploy
      # -------------------------
      - name: Deploy with Helm
        run: |
          helm upgrade --install digital-library ./helm/digital-library \
            -n dev \
            --create-namespace \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/digital-library-frontend \
            --set image.tag=${{ github.sha }}
