apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-library
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: digital-library
  template:
    metadata:
      labels:
        app: digital-library
    spec:

      # 🔥 INIT CONTAINER (RUNS FIRST)
      initContainers:
        - name: init-media
          image: busybox
          command:
            - sh
            - -c
            - |
              echo "Copying media files..."
              cp -r /media/* /assets/
              ls -R /assets
          volumeMounts:
            - name: media
              mountPath: /assets
            - name: media-source
              mountPath: /media

      containers:
        - name: digital-library
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80

          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html/assets

      volumes:
        # PVC (serving files)
        - name: media
          persistentVolumeClaim:
            claimName: digital-library-media

        # SOURCE (where files come from)
        - name: media-source
          hostPath:
            path: /digital-library-data
            type: Directory
