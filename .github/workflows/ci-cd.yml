name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  IMAGE_NAME: digital-library-frontend
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # Docker Login
    # -------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # -------------------------
    # Build Image
    # -------------------------
    - name: Build frontend Docker image
      shell: powershell
      run: |
        docker build `
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} `
          -f frontend/Dockerfile frontend

    # -------------------------
    # Push Image
    # -------------------------
    - name: Push Docker image
      shell: powershell
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # -------------------------
    # Kubernetes Context
    # -------------------------
    - name: Configure kubectl
      shell: powershell
      run: |
        kubectl config use-context docker-desktop
        kubectl get nodes

    # -------------------------
    # Helm Deploy (FIXED)
    # -------------------------
    - name: Deploy with Helm
      shell: powershell
      run: |
        helm upgrade --install digital-library ./helm/digital-library `
          -n ${{ env.ENVIRONMENT }} `
          --create-namespace `
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} `
          --set image.tag=${{ github.sha }} `
          # --atomic `
          --wait `
          --timeout 2m

    # -------------------------
    # Rollout Verification
    # -------------------------
    - name: Verify deployment rollout
      shell: powershell
      run: |
        kubectl rollout status deployment/digital-library `
          -n ${{ env.ENVIRONMENT }} `
          --timeout=300s

    # -------------------------
    # Pod Status
    # -------------------------
    - name: Verify pods
      shell: powershell
      run: |
        kubectl get pods -n ${{ env.ENVIRONMENT }}
