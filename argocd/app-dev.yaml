apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digital-library-dev
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/YOUR_GITHUB/digital-library-platform
    path: helm/digital-library
    helm:
      valueFiles:
      - values-dev.yaml
  syncPolicy:
    automated: {}
