name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      # -------------------------
      # Docker Login
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  
      # - name: Login to Docker Hub
      #   run: |
      #     echo "${{ secrets.DOCKER_PASSWORD }}" | docker login \
      #       -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # -------------------------
      # Build Docker Image
      # -------------------------
      - name: Build frontend Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/digital-library-frontend:${{ github.sha }} -f frontend/Dockerfile frontend
      # -------------------------
      # Push Docker Image
      # -------------------------
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/digital-library-frontend:${{ github.sha }}


          # -------------------------
      # Set Kubernetes Context
      # -------------------------
      # - name: Setup kubeconfig directory
      #   shell: powershell
      #   run: |
      #     New-Item -ItemType Directory -Force -Path "$HOME\.kube"

      # - name: Set kubeconfig
      #   shell: powershell
      #   run: |
      #     $kubeconfig = "${{ secrets.KUBE_CONFIG }}"
      #     $bytes = [System.Convert]::FromBase64String($kubeconfig)
      #     [System.IO.File]::WriteAllBytes("$HOME\.kube\config", $bytes)
    
  
      # - name: Set kubeconfig
      #   run: |
      #     mkdir -p ~/.kube
      #     echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Configure kubectl for Docker Desktop
        shell: powershell
        run: |
          kubectl config use-context docker-desktop
          kubectl get nodes


      # -------------------------
      # Helm Deploy
      # -------------------------
      - name: Deploy with Helm
        shell: powershell
        run: |
          helm upgrade --install digital-library ./helm/digital-library `
            -n dev `
            --create-namespace `
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/digital-library-frontend `
            --set image.tag=${{ github.sha }} `
            --atomic `
            --wait

  
