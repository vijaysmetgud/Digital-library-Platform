name: CI-CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  IMAGE_NAME: digital-library-frontend
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
    # -------------------------
    # Checkout
    # -------------------------
    - name: Checkout code
      uses: actions/checkout@v4

    # -------------------------
    # Docker Login
    # -------------------------
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # -------------------------
    # Build Image
    # -------------------------
    - name: Build frontend Docker image
      run: |
        docker build `
          -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} `
          -f frontend/Dockerfile frontend

    # -------------------------
    # Push Image
    # -------------------------
    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

    # -------------------------
    # Kubernetes Context
    # -------------------------
    - name: Configure kubectl for Docker Desktop
      shell: powershell
      run: |
        kubectl config use-context docker-desktop
        kubectl get nodes

    # -------------------------
    # Helm Deploy
    # -------------------------
    - name: Deploy with Helm
      shell: powershell
      run: |
        helm upgrade --install digital-library ./helm/digital-library `
          -n ${{ env.ENVIRONMENT }} `
          --create-namespace `
          --set image.repository=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} `
          --set image.tag=${{ github.sha }} `
          --atomic `
          --wait

    # -------------------------
    # Health Check (K8s)
    # -------------------------
    - name: Verify rollout status
      shell: powershell
      run: |
        kubectl rollout status deployment/digital-library `
          -n ${{ env.ENVIRONMENT }} `
          --timeout=120s

    - name: Verify pods
      shell: powershell
      run: |
        kubectl get pods -n ${{ env.ENVIRONMENT }}
        echo "The pods are running in the ${{ env.ENVIRONMENT }} namespace."


    # -------------------------
    # PORT FORWARDING SERVICE 
    # -------------------------
    # - name: Port-forward service
    #   shell: powershell
    #   run: |
    #     Start-Process kubectl `
    #       -ArgumentList "port-forward svc/digital-library-service 8080:80 -n ${{ env.ENVIRONMENT }}" `
    #       -NoNewWindow
    #     Start-Sleep -Seconds 5


    - name: Health check via NodePort
      shell: powershell
      run: |
        $nodePort = kubectl get svc digital-library-service `
          -n ${{ env.ENVIRONMENT }} `
          -o jsonpath="{.spec.ports[0].nodePort}"

        Write-Host "NodePort is $nodePort"

        $url = "http://localhost:$nodePort"
        Write-Host "Checking $url"

        try {
          Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 10
          Write-Host "✅ Application is healthy"
        }
        catch {
          Write-Error "❌ Application health check failed"
          exit 1
        }

    # -------------------------
    # (Optional) HTTP Health Check
    # -------------------------    
    # - name: HTTP health check
    #   shell: powershell
    #   run: |
    #     try {
    #       Invoke-WebRequest http://localhost:8080 -UseBasicParsing
    #       Write-Host "App is healthy"
    #     } catch {
    #       throw "Health check failed"
    #     }

    - name: In-cluster HTTP check
      shell: powershell
      run: |
        kubectl run curl-test `
          --rm -i --restart=Never `
          --image=curlimages/curl `
          -- `
          curl -f http://digital-library-service.${{ env.ENVIRONMENT }}.svc.cluster.local
