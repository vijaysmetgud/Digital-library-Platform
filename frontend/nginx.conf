server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        autoindex on;
        types {
            application/pdf pdf;
            video/mp4 mp4;
            audio/mpeg mp3;
        }
    }
}
