name: CI-CD Digital Library (DEV)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: digital-library-frontend
  NAMESPACE: dev

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # Docker build & push
      # -------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} frontend

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      # -------------------------
      # Helm deploy
      # -------------------------
      - name: Deploy with Helm
        shell: powershell
        run: |
          helm upgrade --install digital-library ./helm/digital-library \
            -n ${{ env.NAMESPACE }} \
            -f helm/digital-library/values-dev.yaml \
            --set image.repository=${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${{ github.sha }} \
            --atomic \
            --wait
