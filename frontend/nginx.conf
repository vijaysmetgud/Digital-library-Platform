server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        alias /usr/share/nginx/html/assets/;
        autoindex on;
        types {
            application/pdf pdf;
            video/mp4 mp4;
            audio/mpeg mp3;
        }
    }

    location /content/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
