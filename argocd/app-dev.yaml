apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: digital-library-dev
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/<your-repo>
    path: helm/digital-library
    targetRevision: main
    helm:
      valueFiles:
        - values-dev.yaml
  syncPolicy:
    automated:
      selfHeal: true
